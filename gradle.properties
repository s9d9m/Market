# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.marketutils

# Dependencies
fabric_api_version=0.155.2+26.1.2

# Mappings
# Official Mojang mappings are not published for 26.1.2, so this project
# builds against Yarn instead. "+build.+" resolves to the newest published
# build for 26.1.2 - once a build succeeds, pin the exact resolved build
# number here (e.g. 26.1.2+build.7) for reproducible builds.
yarn_mappings=26.1.2+build.+

# Network Timeouts
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000